<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>Flauta Dulce – Repertorio Estudiantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
<style>
  :root {
    --fg: #1E293B;
    --muted: #64748B;
    --bg: #F1F5F9;
    --card: #FFFFFF;
    --surface: #F8FAFC;
    --border: #E2E8F0;
    --primary: #4F46E5;
    --primary-hover: #4338CA;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: 10px 14px;
    gap: 10px;
    overflow: hidden;
  }

  /* Modo pantalla completa (nativo + modo estudio expandido para iPhone/iOS) */
  body.is-fullscreen {
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    height: 100dvh !important;
    z-index: 999999 !important;
    background: var(--bg) !important;
    padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)) !important;
    gap: 6px !important;
  }

  body.is-fullscreen .controls {
    padding: 5px 10px !important;
    gap: 6px 10px !important;
    border-radius: 12px !important;
  }

  body.is-fullscreen .song-group,
  body.is-fullscreen .speed-group,
  body.is-fullscreen .system-group,
  body.is-fullscreen #toggle-extra,
  body.is-fullscreen .score-header,
  body.is-fullscreen .lbl {
    display: none !important;
  }

  body.is-fullscreen .transport-group {
    flex: 0 0 auto !important;
  }

  body.is-fullscreen .seek-group {
    flex: 1 1 120px !important;
  }

  body.is-fullscreen #play,
  body.is-fullscreen #stop,
  body.is-fullscreen #fs {
    min-height: 32px !important;
    padding: 4px 12px !important;
    font-size: 13px !important;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
  }

  /* ============ Barra superior de controles ============ */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
    padding: 10px 16px;
    flex-shrink: 0;
  }

  .group {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .song-group {
    flex: 2 1 260px;
    min-width: 0;
  }

  .speed-group {
    flex: 1 1 190px;
    min-width: 0;
  }

  .system-group {
    flex: 0 0 auto;
  }

  .transport-group {
    flex: 0 0 auto;
  }

  .seek-group {
    flex: 1 1 280px;
    min-width: 0;
  }

  .actions-right {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-left: auto;
  }

  .lbl {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    white-space: nowrap;
  }

  select {
    flex: 1;
    width: 100%;
    min-height: 36px;
    padding: 4px 12px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    text-overflow: ellipsis;
    transition: border-color 0.15s ease;
  }

  select:hover {
    border-color: #CBD5E1;
  }

  select:focus-visible,
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  button {
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    min-height: 36px;
    padding: 5px 14px;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
  }

  button:active {
    transform: translateY(1px);
  }

  /* Botón principal Iniciar */
  #play {
    background: var(--primary);
    color: #FFFFFF;
    border: none;
    padding: 5px 18px;
    box-shadow: 0 2px 8px rgba(79, 70, 229, 0.28);
  }

  #play:hover {
    background: var(--primary-hover);
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
  }

  /* Botones secundarios */
  .btn-sec {
    background: var(--surface);
    color: var(--fg);
    border: 1px solid var(--border);
  }

  .btn-sec:hover {
    background: #F1F5F9;
    border-color: #CBD5E1;
  }

  #toggle-extra {
    display: none;
  }

  /* Selector agrupado tipo píldora (Digitación) */
  .pill-group {
    display: inline-flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }

  .pill-group button {
    min-height: 28px;
    padding: 3px 12px;
    font-size: 13px;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    box-shadow: none;
  }

  .pill-group button:hover {
    color: var(--fg);
  }

  .pill-group button.on {
    background: var(--card);
    color: var(--fg);
    box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
  }

  /* Controles deslizantes */
  input[type=range] {
    flex: 1;
    min-width: 60px;
    height: 24px;
    accent-color: #4F46E5;
    cursor: pointer;
    margin: 0;
  }

  #speedv {
    min-width: 4.2ch;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 13px;
    color: var(--fg);
  }

  #time {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    min-width: 8ch;
    font-weight: 700;
    color: var(--muted);
  }

  /* ============ Tarjeta principal de partitura ============ */
  .stage-card {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .score-header {
    padding: 8px 16px 6px;
    border-bottom: 1px solid #F1F5F9;
    text-align: center;
    flex-shrink: 0;
  }

  #status {
    margin: 0;
    font-size: 17px;
    font-weight: 800;
    color: var(--fg);
    letter-spacing: -0.01em;
    line-height: 1.2;
  }

  main {
    flex: 1;
    min-height: 0;
    position: relative;
    width: 100%;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: var(--card);
  }

  /* ============ Adaptación Móvil Vertical (Portrait) ============ */
  @media (max-width: 768px) {
    body {
      padding: 6px 8px;
      gap: 6px;
    }

    .controls {
      padding: 8px 10px;
      gap: 6px 8px;
      border-radius: 14px;
    }

    .song-group {
      flex: 1 1 100%;
    }

    .transport-group {
      flex: 1 1 auto;
    }

    .transport-group #play {
      flex: 1;
    }

    #toggle-extra {
      display: inline-flex;
      padding: 5px 10px;
      font-size: 13px;
    }

    .controls.compact-mobile .speed-group,
    .controls.compact-mobile .system-group {
      display: none;
    }

    .speed-group {
      flex: 1 1 48%;
    }

    .system-group {
      flex: 0 0 auto;
    }

    .system-group .lbl {
      display: none;
    }

    .seek-group {
      flex: 1 1 100%;
    }

    .actions-right {
      margin-left: 0;
    }

    .fs-label {
      display: none;
    }

    #fs {
      padding: 5px 10px;
    }

    .stage-card {
      border-radius: 14px;
    }

    .score-header {
      padding: 6px 12px 5px;
    }

    #status {
      font-size: 15px;
    }
  }

  /* ============ Adaptación Móvil Horizontal (Landscape) ============ */
  @media (max-height: 520px) and (orientation: landscape) {
    body {
      padding: 4px 6px;
      gap: 4px;
    }

    .controls {
      padding: 4px 8px;
      gap: 4px 8px;
      border-radius: 12px;
    }

    .controls.compact-mobile .speed-group,
    .controls.compact-mobile .system-group {
      display: flex;
    }

    #toggle-extra,
    .lbl {
      display: none;
    }

    select, button {
      min-height: 30px;
      font-size: 13px;
      padding: 2px 10px;
      border-radius: 8px;
    }

    .pill-group {
      padding: 2px;
    }

    .pill-group button {
      min-height: 24px;
      padding: 2px 9px;
      font-size: 12px;
    }

    .song-group {
      flex: 1 1 140px;
      max-width: 195px;
    }

    .transport-group {
      flex: 0 0 auto;
    }

    .speed-group {
      flex: 1 1 100px;
      max-width: 155px;
    }

    .system-group {
      flex: 0 0 auto;
    }

    .seek-group {
      flex: 1 1 130px;
    }

    #time {
      font-size: 12px;
      min-width: 7.2ch;
    }

    input[type=range] {
      height: 20px;
      min-width: 45px;
    }

    .fs-label {
      display: none;
    }

    .stage-card {
      border-radius: 12px;
    }

    .score-header {
      padding: 3px 10px 2px;
    }

    #status {
      font-size: 13px;
    }
  }
</style>
</head>
<body>

<div class="controls card" id="controls-bar">
  <div class="group song-group">
    <label class="lbl" for="song">Canción</label>
    <select id="song" aria-label="Elegir canción"></select>
  </div>

  <div class="group speed-group">
    <label class="lbl" for="speed">Velocidad</label>
    <input type="range" id="speed" min="50" max="200" step="5" value="100" aria-label="Velocidad">
    <output id="speedv" for="speed">100%</output>
  </div>

  <div class="group system-group">
    <span class="lbl">Digitación</span>
    <div class="pill-group" id="systems" role="group" aria-label="Sistema de digitación">
      <button type="button" data-sys="alemana">Alemana</button>
      <button type="button" data-sys="barroca" class="on">Barroca</button>
    </div>
  </div>

  <div class="group transport-group">
    <button id="play"><span aria-hidden="true">▶</span> Iniciar</button>
    <button id="stop" class="btn-sec" title="Reiniciar">Reiniciar</button>
    <button id="toggle-extra" class="btn-sec" type="button" aria-expanded="true">Ajustes ▴</button>
  </div>

  <div class="group seek-group">
    <span id="time">0:00 / 0:00</span>
    <input type="range" id="seek" min="0" max="1" step="any" value="0" aria-label="Posición en la canción">
  </div>

  <div class="actions-right">
    <button id="fs" class="btn-sec" type="button" title="Pantalla completa">
      <span aria-hidden="true">⛶</span><span class="fs-label">Pantalla completa</span>
    </button>
  </div>
</div>

<section class="stage-card card">
  <header class="score-header">
    <h1 id="status">Viva el Carnaval</h1>
  </header>
  <main id="stage"><canvas id="cv"></canvas></main>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<script>
window.addEventListener("load", () => {
  const el = id => document.getElementById(id);
  const VF = window.Vex && window.Vex.Flow;

  /* ============ 1. Repertorio (carpeta "midis") ============ */
  const REPERTORIO = [
    { nombre: "Viva el Carnaval", url: "./midis/viva el carnaval.mid" },
    { nombre: "Tinom-Tanom 1", url: "./midis/Tinom-Tanom 1.mid" },
    { nombre: "Tinom-Tanom 2", url: "./midis/Tinom-Tanom 2.mid" },
    { nombre: "Oh quédate con nosotros - BWV 253", url: "./midis/BWV253.mid" }
  ];

  /* ============ 2. Digitaciones y Mapeo VexFlow (flauta dulce soprano) ============ */
  const LABELS = { "C5":"Do", "D5":"Re", "E5":"Mi", "F5":"Fa", "F#5":"Fa#", "G5":"Sol", "A5":"La", "B5":"Si", "C6":"Do’", "D6":"Re’" };
  const VEX_KEYS = {
    "C5":  { key: "c/4",  acc: null },
    "D5":  { key: "d/4",  acc: null },
    "E5":  { key: "e/4",  acc: null },
    "F5":  { key: "f/4",  acc: null },
    "F#5": { key: "f#/4", acc: "#"  },
    "G5":  { key: "g/4",  acc: null },
    "A5":  { key: "a/4",  acc: null },
    "B5":  { key: "b/4",  acc: null },
    "C6":  { key: "c/5",  acc: null },
    "D6":  { key: "d/5",  acc: null }
  };

  const COMMON = {
    "C5":  [1,1,1,1,1,1,1,1], "D5":  [1,1,1,1,1,1,1,0], "E5":  [1,1,1,1,1,1,0,0],
    "G5":  [1,1,1,1,0,0,0,0], "A5":  [1,1,1,0,0,0,0,0], "B5":  [1,1,0,0,0,0,0,0],
    "C6":  [1,0,1,0,0,0,0,0], "D6":  [0,0,1,0,0,0,0,0]
  };

  const SYSTEMS = {
    barroca: Object.assign({}, COMMON, { "F5": [1,1,1,1,1,0,1,1], "F#5": [1,1,1,1,0,1,1,0] }),
    alemana: Object.assign({}, COMMON, { "F5": [1,1,1,1,1,0,0,0], "F#5": [1,1,1,1,0,1,1,1] })
  };

  let system = "barroca";
  const holesOf = key => SYSTEMS[system][key];
  const BY_MIDI = {};
  Object.keys(LABELS).forEach(n => { BY_MIDI[Math.round(Tone.Frequency(n).toMidi())] = n; });

  const PC_COLORS = ["#EB2427","#EF4D27","#F6851F","#FFC000","#FBED1B","#6BBE46","#30B24F","#0C9648","#1500FF","#80539F","#C800FF","#E14197"];
  const colorOf = key => PC_COLORS[Math.round(Tone.Frequency(key).toMidi()) % 12];

  function hexToRgba(hex, alpha) {
    const clean = hex.replace("#", "");
    const num = parseInt(clean, 16);
    const r = (num >> 16) & 255;
    const g = (num >> 8) & 255;
    const b = num & 255;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function lookup(midi) {
    for (const k of [0, 1, -1, 2, -2, 3, -3]) { const f = BY_MIDI[midi + 12 * k]; if (f) return f; }
    return null;
  }

  /* Tabla de duraciones en pulsos -> códigos VexFlow */
  const DUR_TABLE = [
    { beats: 4,    code: "w",  dotted: false },
    { beats: 3,    code: "hd", dotted: true  },
    { beats: 2,    code: "h",  dotted: false },
    { beats: 1.5,  code: "qd", dotted: true  },
    { beats: 1,    code: "q",  dotted: false },
    { beats: 0.75, code: "8d", dotted: true  },
    { beats: 0.5,  code: "8",  dotted: false },
    { beats: 0.25, code: "16", dotted: false }
  ];

  function matchVexDuration(beats) {
    let best = DUR_TABLE[4]; // "q" por defecto
    let minDiff = Infinity;
    for (const item of DUR_TABLE) {
      const diff = Math.abs(beats - item.beats);
      if (diff < minDiff) {
        minDiff = diff;
        best = item;
      }
    }
    return best;
  }

  /* ============ 3. Audio ============ */
  const vibrato = new Tone.Vibrato(5, 0.08).toDestination();
  const synth = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "custom", partials: [1, 0.22, 0.06] },
    envelope: { attack: 0.05, decay: 0.1, sustain: 0.85, release: 0.15 }
  }).connect(vibrato);
  synth.volume.value = -6;

  const click = new Tone.MembraneSynth({
    pitchDecay: 0.008, octaves: 2,
    envelope: { attack: 0.001, decay: 0.08, sustain: 0, release: 0.01 }
  }).toDestination();
  click.volume.value = -8;

  /* ============ 4. Estado y Carga ============ */
  let song = { notes: [], rests: [], bpm: 100, ppq: 480, num: 4, lead: 4, endBeat: 1 };
  let speed = 1, posTicks = 0, loadToken = 0;

  function buildSong(raw, bpm, ppq, num, name) {
    resetPlayback();
    const T = Tone.Transport;
    T.cancel();
    T.PPQ = ppq;
    num = Math.min(Math.max(num || 4, 2), 6);

    const secPerBeat = 60 / bpm;
    const notes = [];
    raw.sort((a, b) => a.ticks - b.ticks).forEach(n => {
      const key = lookup(n.midi);
      if (!key) return;
      const durSec = (n.durationTicks / ppq) * secPerBeat;
      const durBeats = durSec / secPerBeat;
      const vexInfo = VEX_KEYS[key];
      notes.push({
        midi: n.midi,
        key: key,
        label: LABELS[key],
        vexKey: vexInfo.key,
        vexAcc: vexInfo.acc,
        color: colorOf(key),
        startBeat: n.ticks / ppq + num,
        durBeats: durBeats,
        vel: n.velocity || 0.8,
        ticks: n.ticks + num * ppq,
        dur: n.durationTicks
      });
    });

    // Calcular duración rítmica VexFlow y silencios >= 0.25 pulsos
    const rests = [];
    for (let i = 0; i < notes.length; i++) {
      const n = notes[i];
      const next = notes[i + 1];
      const noteEnd = n.startBeat + n.durBeats;
      const rawGap = next ? (next.startBeat - noteEnd) : 0;

      // Si hay un micro-espacio de articulación (< 0.25 pulsos), ajustar al pulso real de la figura
      const effectiveBeats = (next && rawGap > 0 && rawGap < 0.25)
        ? (next.startBeat - n.startBeat)
        : n.durBeats;

      const matched = matchVexDuration(effectiveBeats);
      n.vexCode = matched.code;
      n.vexDotted = matched.dotted;
      n.notationBeats = matched.beats;
      n.beatIndex = Math.floor(n.startBeat + 0.001);

      // Si entre el final de una nota y el inicio de la siguiente hay silencio >= 0.25 pulsos
      if (next && rawGap >= 0.25) {
        let rem = rawGap;
        let curRestBeat = noteEnd;
        let safety = 0;
        while (rem >= 0.24 && safety++ < 16) {
          let chosen = DUR_TABLE[DUR_TABLE.length - 1];
          for (const item of DUR_TABLE) {
            if (item.beats <= rem + 0.04) {
              chosen = item;
              break;
            }
          }
          rests.push({
            startBeat: curRestBeat,
            durBeats: chosen.beats,
            vexCode: chosen.code + "r",
            vexDotted: chosen.dotted
          });
          curRestBeat += chosen.beats;
          rem -= chosen.beats;
        }
      }
    }

    song = {
      notes,
      rests,
      bpm,
      ppq,
      num,
      lead: num,
      endBeat: Math.max(1, notes.reduce((m, n) => Math.max(m, n.startBeat + n.durBeats), 0) + 1.5)
    };

    notes.forEach(n => {
      T.schedule(time => {
        const d = Math.max(new Tone.Ticks(n.dur).toSeconds() * 0.95, 0.1);
        synth.triggerAttackRelease(Tone.Frequency(n.midi, "midi").toFrequency(), d, time, n.vel);
      }, n.ticks + "i");
    });

    T.scheduleRepeat(time => {
      const b = Math.round(T.getTicksAtTime(time) / ppq);
      click.triggerAttackRelease(b % num === 0 ? "C3" : "G2", "32n", time);
    }, "4n");

    T.bpm.value = bpm * speed;
    el("seek").max = song.endBeat;
    el("seek").value = 0;
    el("status").textContent = name;
  }

  async function loadMidi(index) {
    const item = REPERTORIO[index], token = ++loadToken;
    resetPlayback();
    el("status").textContent = item.nombre;
    try {
      const r = await fetch(item.url);
      if (!r.ok) throw new Error(`No se encontró el archivo en ${item.url}`);
      const buf = await r.arrayBuffer();
      if (token !== loadToken) return;

      const MidiClass = (window.Midi && window.Midi.Midi) || window.Midi;
      const midi = new MidiClass(buf);
      const raw = [];
      midi.tracks.forEach(tr => {
        if (tr.instrument && tr.instrument.percussion) return;
        tr.notes.forEach(n => raw.push({ midi: n.midi, ticks: n.ticks, durationTicks: n.durationTicks, velocity: n.velocity }));
      });

      if (!raw.length) throw new Error("El archivo MIDI no contiene notas.");
      const bpm = midi.header.tempos.length ? midi.header.tempos[0].bpm : 120;
      const ts = midi.header.timeSignatures.length ? midi.header.timeSignatures[0].timeSignature[0] : 4;
      buildSong(raw, bpm, midi.header.ppq, ts, item.nombre);
    } catch (err) {
      if (token !== loadToken) return;
      el("status").textContent = item.nombre;
      console.error(err);
    }
  }

  const songSel = el("song");
  REPERTORIO.forEach((s, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = s.nombre;
    songSel.append(o);
  });
  songSel.addEventListener("change", () => loadMidi(parseInt(songSel.value, 10)));

  /* ============ 5. Controles y Pantalla Completa ============ */
  const ticksNow = () => Tone.Transport.getTicksAtTime(Tone.getContext().currentTime);
  const getBeat = () => (Tone.Transport.state === "started" ? ticksNow() : posTicks) / Tone.Transport.PPQ;

  function setPlayButtonState(playing) {
    el("play").innerHTML = playing
      ? '<span aria-hidden="true">⏸</span> Pausa'
      : '<span aria-hidden="true">▶</span> Iniciar';
  }

  function resetPlayback() {
    Tone.Transport.stop();
    posTicks = 0;
    synth.releaseAll();
    setPlayButtonState(false);
    el("seek").value = 0;
  }

  el("play").addEventListener("click", async () => {
    await Tone.start();
    const T = Tone.Transport;
    if (T.state === "started") {
      posTicks = ticksNow();
      T.pause();
      synth.releaseAll();
      setPlayButtonState(false);
    } else {
      if (posTicks / T.PPQ >= song.endBeat - 0.01) posTicks = 0;
      T.start(undefined, Math.round(posTicks) + "i");
      setPlayButtonState(true);
    }
  });

  el("stop").addEventListener("click", resetPlayback);

  el("speed").addEventListener("input", e => {
    const v = parseInt(e.target.value, 10);
    speed = v / 100;
    el("speedv").textContent = v + "%";
    Tone.Transport.bpm.value = song.bpm * speed;
  });

  el("systems").addEventListener("click", e => {
    const b = e.target.closest("button[data-sys]"); if (!b) return;
    system = b.dataset.sys;
    [...el("systems").querySelectorAll("button")].forEach(x => x.classList.toggle("on", x === b));
  });

  /* Colapsar/mostrar ajustes secundarios en móvil vertical */
  const controlsBar = el("controls-bar");
  const toggleExtraBtn = el("toggle-extra");
  toggleExtraBtn.addEventListener("click", () => {
    const compact = controlsBar.classList.toggle("compact-mobile");
    toggleExtraBtn.setAttribute("aria-expanded", String(!compact));
    toggleExtraBtn.textContent = compact ? "Ajustes ▾" : "Ajustes ▴";
    requestAnimationFrame(resize);
  });

  /* Pantalla completa híbrida (Android/PC nativo + modo estudio expandido en iPhone/iOS) */
  function updateFsButton(active) {
    el("fs").innerHTML = active
      ? '<span aria-hidden="true">✕</span><span class="fs-label">Salir</span>'
      : '<span aria-hidden="true">⛶</span><span class="fs-label">Pantalla completa</span>';
  }

  function enterStudyFullscreen() {
    document.body.classList.add("is-fullscreen");
    updateFsButton(true);
    window.scrollTo(0, 1);
    setTimeout(resize, 60);
  }

  function exitStudyFullscreen() {
    document.body.classList.remove("is-fullscreen");
    updateFsButton(false);
    setTimeout(resize, 60);
  }

  function toggleFullscreen() {
    const nativeFS = document.fullscreenElement || document.webkitFullscreenElement;
    const cssFS = document.body.classList.contains("is-fullscreen");

    if (!nativeFS && !cssFS) {
      enterStudyFullscreen();
      const doc = document.documentElement;
      const req = doc.requestFullscreen || doc.webkitRequestFullscreen;
      if (typeof req === "function") {
        try {
          const p = req.call(doc);
          if (p && typeof p.catch === "function") p.catch(() => {});
        } catch (e) {}
      }
    } else {
      exitStudyFullscreen();
      if (nativeFS) {
        try {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen().catch(() => {});
        } catch (e) {}
      }
    }
  }

  el("fs").addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement && document.body.classList.contains("is-fullscreen")) {
      exitStudyFullscreen();
    } else {
      resize();
    }
  });

  const seek = el("seek");
  let dragging = false, wasPlaying = false, lastSeek = 0;

  seek.addEventListener("pointerdown", () => {
    dragging = true;
    wasPlaying = Tone.Transport.state === "started";
    if (wasPlaying) {
      posTicks = ticksNow();
      Tone.Transport.pause();
      synth.releaseAll();
    }
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    posTicks = Math.round(parseFloat(seek.value) * Tone.Transport.PPQ);
    if (wasPlaying) {
      Tone.Transport.start(undefined, posTicks + "i");
      wasPlaying = false;
    }
  }

  ["pointerup", "pointercancel", "change"].forEach(ev => seek.addEventListener(ev, endDrag));

  seek.addEventListener("input", () => {
    lastSeek = performance.now();
    posTicks = Math.round(parseFloat(seek.value) * Tone.Transport.PPQ);
    if (!dragging && Tone.Transport.state === "started") {
      Tone.Transport.pause();
      synth.releaseAll();
      Tone.Transport.start(undefined, posTicks + "i");
    }
  });

  /* ============ 6. Dibujo adaptativo y VexFlow 4 ============ */
  const cv = el("cv"), ctx = cv.getContext("2d"), stage = el("stage");
  const vfRenderer = VF ? new VF.Renderer(cv, VF.Renderer.Backends.CANVAS) : null;
  const vfCtx = vfRenderer ? vfRenderer.getContext() : null;

  let W = 800, H = 450, dpr = 1;
  const L = {};
  const widthOf = h => 0.16 * h;
  const HOLE_Y = [0.21, 0.31, 0.39, 0.47, 0.60, 0.68, 0.76, 0.84];

  function computeLayout() {
    const isPortraitMobile = W < 650 && H >= W;
    const isLandscapeMobile = H < 500 && W > H;

    if (isPortraitMobile) {
      L.sp = Math.max(9.5, Math.min(12.2, W * 0.03));
      const staffH = 4 * L.sp;
      const topLabelPad = 30;
      const botPad = Math.max(18, L.sp * 1.8);
      const midGap = Math.max(16, H * 0.035);

      L.recvH = Math.max(125, Math.min(195, H * 0.34));
      L.moveH = L.recvH * 0.58;

      const totalBlockH = topLabelPad + L.recvH + midGap + staffH + botPad;
      const startY = Math.max(12, (H - totalBlockH) * 0.46);
      L.cy = startY + topLabelPad + L.recvH / 2;
      L.staffTop = L.cy + L.recvH / 2 + midGap;

      L.clefX = Math.max(22, L.sp * 1.85);
      L.recvX = Math.max(L.clefX + L.sp * 2.5 + 0.165 * L.recvH, Math.min(108, W * 0.23));

      const availW = Math.max(180, W - L.recvX);
      L.pxBeat = Math.max(132, Math.min(168, availW * 0.46));

      L.pulseX = Math.max(26, L.clefX + 4);
      L.pulseY = Math.max(26, startY + 12);
      L.pulseScale = 0.78;

    } else if (isLandscapeMobile) {
      L.sp = Math.max(9.5, Math.min(12.5, H * 0.038));
      const staffH = 4 * L.sp;
      const topPad = Math.max(26, H * 0.10);
      const botPad = Math.max(14, L.sp * 1.6);
      const midGap = Math.max(12, H * 0.045);

      L.recvH = Math.max(115, H - topPad - midGap - staffH - botPad);
      L.moveH = L.recvH * 0.62;
      L.cy = topPad + L.recvH / 2;
      L.staffTop = L.cy + L.recvH / 2 + midGap;

      L.clefX = Math.max(26, L.sp * 2.1);
      L.recvX = Math.max(L.clefX + L.sp * 2.8 + 0.165 * L.recvH, Math.min(135, W * 0.16));

      const availW = Math.max(240, W - L.recvX);
      L.pxBeat = Math.max(96, Math.min(126, availW * 0.155));

      L.pulseX = Math.max(28, L.clefX);
      L.pulseY = Math.max(22, topPad * 0.75);
      L.pulseScale = 0.72;

    } else {
      L.sp = Math.max(13, Math.min(18, H * 0.028, W * 0.022));
      const staffH = 4 * L.sp;
      const topPad = Math.max(40, H * 0.09);
      const botPad = Math.max(22, L.sp * 1.75);
      const midGap = Math.max(18, H * 0.055);

      L.recvH = Math.max(165, H - topPad - midGap - staffH - botPad);
      L.moveH = L.recvH * 0.66;
      L.cy = topPad + L.recvH / 2;
      L.staffTop = L.cy + L.recvH / 2 + midGap;

      L.clefX = Math.max(44, L.sp * 2.8);
      L.recvX = Math.max(L.clefX + L.sp * 3.2 + 0.165 * L.recvH, Math.min(195, W * 0.15));

      const availW = Math.max(300, W - L.recvX);
      L.pxBeat = Math.max(175, Math.min(245, availW * 0.22));

      L.pulseX = Math.max(42, L.clefX + 6);
      L.pulseY = Math.max(36, topPad * 0.85);
      L.pulseScale = 1;
    }

    // La línea de lectura coincide exactamente con el centro de la flauta monitora
    L.contactX = L.recvX;
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    W = Math.max(220, Math.floor(r.width));
    H = Math.max(160, Math.floor(r.height));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * dpr;
    cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    computeLayout();
  }

  new ResizeObserver(resize).observe(stage);
  window.addEventListener("resize", resize);
  resize();

  /* Indicador visual de metrónomo en la esquina superior izquierda */
  function drawMetronomeLight(beat) {
    const cx = L.pulseX, cy = L.pulseY, sc = L.pulseScale;
    const isPlaying = Tone.Transport.state === "started" && song.notes.length > 0 && beat >= 0;
    let intensity = 0;
    let isAccent = false;

    if (isPlaying) {
      const beatIdx = Math.floor(beat);
      const frac = beat - beatIdx;
      intensity = Math.pow(1 - frac, 2.0);
      isAccent = (beatIdx % song.num) === 0;
    }

    const baseR = 12 * sc;
    const coreR = baseR + 5 * sc * intensity;
    const haloR = baseR + 20 * sc * intensity;

    ctx.save();

    if (intensity > 0.02) {
      const grad = ctx.createRadialGradient(cx, cy, coreR * 0.25, cx, cy, haloR);
      if (isAccent) {
        grad.addColorStop(0, `rgba(79, 70, 229, ${0.42 * intensity})`);
        grad.addColorStop(0.6, `rgba(129, 140, 248, ${0.18 * intensity})`);
        grad.addColorStop(1, "rgba(129, 140, 248, 0)");
      } else {
        grad.addColorStop(0, `rgba(99, 102, 241, ${0.30 * intensity})`);
        grad.addColorStop(0.6, `rgba(165, 180, 252, ${0.14 * intensity})`);
        grad.addColorStop(1, "rgba(165, 180, 252, 0)");
      }
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, haloR, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
    if (intensity > 0.04) {
      ctx.fillStyle = isAccent
        ? `rgba(79, 70, 229, ${0.22 + 0.68 * intensity})`
        : `rgba(129, 140, 248, ${0.18 + 0.58 * intensity})`;
      ctx.strokeStyle = isAccent ? "#4F46E5" : "#818CF8";
    } else {
      ctx.fillStyle = "#F8FAFC";
      ctx.strokeStyle = "#CBD5E1";
    }
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "#64748B";
    ctx.font = `700 ${Math.round(12 * sc)}px 'Nunito', sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText("Pulso", cx, cy + baseR + 5 * sc);

    ctx.restore();
  }

  /* Silueta vertical de flauta dulce (monitora a la izquierda o entrante a la derecha) */
  function drawFlute(cx, topY, h, holes, lit, color, isMonitor) {
    color = color || "#334155";
    const w = widthOf(h), y = v => topY + v * h;
    const strokeMain = isMonitor ? "#334155" : "#94A3B8";

    ctx.save();
    ctx.lineJoin = "round";
    ctx.strokeStyle = strokeMain;
    ctx.lineWidth = isMonitor ? (lit ? 3 : 2.2) : 1.6;

    ctx.beginPath();
    ctx.moveTo(cx - 0.35 * w, y(0));   ctx.lineTo(cx + 0.35 * w, y(0));
    ctx.lineTo(cx + 0.35 * w, y(0.10)); ctx.lineTo(cx + 0.5 * w, y(0.14));
    ctx.lineTo(cx + 0.5 * w, y(0.90)); ctx.lineTo(cx + 0.72 * w, y(1));
    ctx.lineTo(cx - 0.72 * w, y(1));   ctx.lineTo(cx - 0.5 * w, y(0.90));
    ctx.lineTo(cx - 0.5 * w, y(0.14)); ctx.lineTo(cx - 0.35 * w, y(0.10));
    ctx.closePath();

    ctx.fillStyle = "#FFFFFF";
    ctx.fill();

    if (isMonitor && lit) {
      ctx.fillStyle = hexToRgba(color, 0.12);
      ctx.fill();
    }
    ctx.stroke();

    ctx.lineWidth = isMonitor ? 1.6 : 1.2;
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(cx - 0.22 * w, y(0.115), 0.44 * w, 0.03 * h);
    ctx.strokeRect(cx - 0.22 * w, y(0.115), 0.44 * w, 0.03 * h);

    const thumbOffset = Math.max(4, 0.022 * h);
    holes.forEach((covered, i) => {
      const r = 0.031 * h, hy = y(HOLE_Y[i]);
      const hx = i === 0 ? cx - 0.5 * w - r - thumbOffset : cx;

      if (isMonitor && lit && covered) {
        ctx.shadowColor = hexToRgba(color, 0.65);
        ctx.shadowBlur = Math.max(10, 0.045 * h);
      } else {
        ctx.shadowBlur = 0;
      }

      ctx.beginPath();
      ctx.arc(hx, hy, r, 0, Math.PI * 2);
      ctx.fillStyle = covered ? color : "#FFFFFF";
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.lineWidth = isMonitor ? 1.8 : 1.3;
      ctx.strokeStyle = covered ? (isMonitor ? "#334155" : "#64748B") : strokeMain;
      ctx.stroke();

      if (isMonitor && lit && covered) {
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = hexToRgba(color, 0.4);
        ctx.beginPath();
        ctx.arc(hx, hy, r + Math.max(3, 0.014 * h), 0, Math.PI * 2);
        ctx.stroke();
      }
    });

    ctx.restore();
  }

  /* ============ Pentagrama profesional con VexFlow 4 ============ */
  function drawStaffVexFlow(beat, active) {
    if (!VF || !vfCtx) return;

    const sp = L.sp;
    const bottom = L.staffTop + 4 * sp;
    const marginX = Math.max(10, W * 0.012);
    const staffClipX = L.clefX + sp * 1.95;

    vfCtx.save();

    // 1. Pentagrama base (5 líneas en gris suave #CBD5E1)
    const baseStave = new VF.Stave(marginX, L.staffTop, W - 2 * marginX, {
      spacing_between_lines_px: sp,
      space_above_staff_ln: 0,
      space_below_staff_ln: 0,
      left_bar: false,
      right_bar: false
    });
    baseStave.setStyle({ strokeStyle: "#CBD5E1", fillStyle: "#CBD5E1" });
    baseStave.setContext(vfCtx).draw();

    // 2. Clave de Sol fija a la izquierda en gris pizarra (#334155)
    const clefStave = new VF.Stave(marginX, L.staffTop, Math.max(60, sp * 4.5), {
      spacing_between_lines_px: sp,
      space_above_staff_ln: 0,
      space_below_staff_ln: 0,
      left_bar: false,
      right_bar: false
    });
    clefStave.setStyle({ strokeStyle: "#334155", fillStyle: "#334155" });
    clefStave.addClef("treble");
    clefStave.format();
    clefStave.getModifiers().forEach(mod => {
      mod.setStave(clefStave).setContext(vfCtx).draw();
    });

    // Área recortada para notas, silencios y barras de compás que avanzan
    ctx.save();
    ctx.beginPath();
    ctx.rect(staffClipX, L.staffTop - sp * 4.2, W - staffClipX, H - (L.staffTop - sp * 4.2));
    ctx.clip();

    // 3. Líneas divisorias de compás en gris suave (#CBD5E1)
    const m = song.num;
    let b = Math.max(m, Math.ceil((beat - (L.contactX - staffClipX) / L.pxBeat) / m) * m);
    for (; ; b += m) {
      const x = L.contactX + (b - 0.125 - beat) * L.pxBeat;
      if (x > W - marginX) break;
      ctx.strokeStyle = "#CBD5E1";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, L.staffTop);
      ctx.lineTo(x, bottom);
      ctx.stroke();
    }

    const noteStartX = baseStave.getNoteStartX();
    const visibleDrawables = [];
    const beamGroups = [];
    let currentBeamGroup = null;

    // 4. Construcción manual de StaveNotes posicionados con TickContext en la X exacta de cada flauta
    for (let i = 0; i < song.notes.length; i++) {
      const n = song.notes[i];
      const x = L.contactX + (n.startBeat - beat) * L.pxBeat;

      if (x > W + 90) {
        if (currentBeamGroup && currentBeamGroup.notes.length >= 2) {
          beamGroups.push(currentBeamGroup);
        }
        currentBeamGroup = null;
        break;
      }

      if (x < staffClipX - 90) {
        continue;
      }

      const staveNote = new VF.StaveNote({
        keys: [n.vexKey],
        duration: n.vexCode,
        auto_stem: true
      });

      if (n.vexAcc) {
        staveNote.addModifier(new VF.Accidental(n.vexAcc), 0);
      }
      if (n.vexDotted) {
        VF.Dot.buildAndAttach([staveNote]);
      }

      // Conservar código de colores de cada nota
      staveNote.setStyle({ fillStyle: n.color, strokeStyle: n.color });
      staveNote.setKeyStyle(0, { fillStyle: n.color, strokeStyle: n.color });
      staveNote.setStave(baseStave);

      // Posicionar manualmente con TickContext en la coordenada X exacta de su flauta
      const tc = new VF.TickContext();
      tc.addTickable(staveNote);
      tc.preFormat();
      const halfHeadW = (staveNote.getGlyphWidth() || 10) / 2;
      tc.setX(x - noteStartX - halfHeadW);

      visibleDrawables.push({
        staveNote,
        x,
        isActive: n === active
      });

      // Agrupar corcheas ("8") y semicorcheas ("16") consecutivas dentro del mismo pulso
      const isBeamable = (n.vexCode === "8" || n.vexCode === "16");
      if (isBeamable) {
        const isContiguous = currentBeamGroup &&
          currentBeamGroup.beatIndex === n.beatIndex &&
          Math.abs(currentBeamGroup.expectedNextBeat - n.startBeat) < 0.06;

        if (isContiguous) {
          currentBeamGroup.notes.push(staveNote);
          currentBeamGroup.colors.push(n.color);
          currentBeamGroup.expectedNextBeat = n.startBeat + n.notationBeats;
        } else {
          if (currentBeamGroup && currentBeamGroup.notes.length >= 2) {
            beamGroups.push(currentBeamGroup);
          }
          currentBeamGroup = {
            beatIndex: n.beatIndex,
            notes: [staveNote],
            colors: [n.color],
            expectedNextBeat: n.startBeat + n.notationBeats
          };
        }
      } else {
        if (currentBeamGroup && currentBeamGroup.notes.length >= 2) {
          beamGroups.push(currentBeamGroup);
        }
        currentBeamGroup = null;
      }
    }

    if (currentBeamGroup && currentBeamGroup.notes.length >= 2) {
      beamGroups.push(currentBeamGroup);
    }

    // 5. Silencios (>= 0.25 pulsos) en gris suave (#94A3B8)
    for (let i = 0; i < song.rests.length; i++) {
      const r = song.rests[i];
      const x = L.contactX + (r.startBeat - beat) * L.pxBeat;
      if (x > W + 60) break;
      if (x < staffClipX - 60) continue;

      const restNote = new VF.StaveNote({
        keys: ["b/4"],
        duration: r.vexCode
      });

      if (r.vexDotted) {
        VF.Dot.buildAndAttach([restNote]);
      }

      restNote.setStyle({ fillStyle: "#94A3B8", strokeStyle: "#94A3B8" });
      restNote.setKeyStyle(0, { fillStyle: "#94A3B8", strokeStyle: "#94A3B8" });
      restNote.setStave(baseStave);

      const tc = new VF.TickContext();
      tc.addTickable(restNote);
      tc.preFormat();
      const halfHeadW = (restNote.getGlyphWidth() || 10) / 2;
      tc.setX(x - noteStartX - halfHeadW);

      visibleDrawables.push({
        staveNote: restNote,
        x,
        isActive: false
      });
    }

    // 6. Crear Vex.Flow.Beam antes de dibujar para alinear plicas y ocultar corchetes sueltos
    const vfBeams = beamGroups.map(grp => {
      const beam = new VF.Beam(grp.notes, true);
      const sameColor = grp.colors.every(c => c === grp.colors[0]);
      const beamColor = sameColor ? grp.colors[0] : "#334155";
      beam.setStyle({ fillStyle: beamColor, strokeStyle: beamColor });
      return beam;
    });

    // 7. Dibujar todas las notas y silencios en el contexto
    for (const item of visibleDrawables) {
      item.staveNote.setContext(vfCtx).draw();

      // Aro indicador suave en la nota que está sonando
      if (item.isActive) {
        const ys = item.staveNote.getYs();
        const noteY = (ys && ys.length) ? ys[0] : (L.staffTop + 2 * sp);
        ctx.save();
        ctx.strokeStyle = "#4F46E5";
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(item.x, noteY, sp * 1.25, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    // 8. Dibujar las barras de agrupación (Beams)
    for (const beam of vfBeams) {
      beam.setContext(vfCtx).draw();
    }

    // 9. Línea vertical de lectura alineada con el centro de la flauta monitora (L.recvX)
    const lineTop = L.cy + L.recvH * 0.5 + 4;
    const lineBot = Math.min(H - 6, bottom + sp * 1.5);
    ctx.strokeStyle = "#818CF8";
    ctx.setLineDash([5, 5]);
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(L.contactX, lineTop);
    ctx.lineTo(L.contactX, lineBot);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.restore();
    vfCtx.restore();
  }

  const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  function frame() {
    const beat = getBeat() || 0;
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#1E293B";
    ctx.textAlign = "center";

    // Señal luminosa de metrónomo en esquina superior izquierda
    drawMetronomeLight(beat);

    // Flautas entrantes (derecha), recortadas al borde derecho de la flauta monitora
    let active = null;
    const topMove = L.cy - L.moveH / 2;
    const moveFontSize = Math.max(12, Math.min(20, Math.round(L.moveH * 0.09)));
    const moveClipX = L.recvX + widthOf(L.recvH) * 0.45;
    ctx.save();
    ctx.beginPath();
    ctx.rect(moveClipX, 0, W - moveClipX, L.staffTop - L.sp * 1.2);
    ctx.clip();
    for (const n of song.notes) {
      const x = L.contactX + (n.startBeat - beat) * L.pxBeat;
      if (beat >= n.startBeat && beat < n.startBeat + n.durBeats) active = n;
      if (x > W + 40) break;
      if (x < moveClipX - 24) continue;
      ctx.fillStyle = "#1E293B";
      ctx.font = `700 ${moveFontSize}px 'Nunito', sans-serif`;
      ctx.textBaseline = "alphabetic";
      ctx.fillText(n.label, x, topMove - Math.max(5, L.moveH * 0.045));
      drawFlute(x, topMove, L.moveH, holesOf(n.key), false, n.color, false);
    }
    ctx.restore();

    // Flauta monitora fija (izquierda)
    const recvTop = L.cy - L.recvH / 2;
    const recvFontSize = Math.max(18, Math.min(38, Math.round(L.recvH * 0.115)));
    ctx.fillStyle = "#1E293B";
    ctx.font = `800 ${recvFontSize}px 'Nunito', sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    if (active) {
      ctx.fillText(active.label, L.recvX, recvTop - Math.max(7, L.recvH * 0.045));
    }

    drawFlute(
      L.recvX,
      recvTop,
      L.recvH,
      active ? holesOf(active.key) : [0,0,0,0,0,0,0,0],
      !!active,
      active ? active.color : "#334155",
      true
    );

    // Pentagrama renderizado con VexFlow 4
    drawStaffVexFlow(beat, active);

    if (song.notes.length > 0) {
      const spb = 60 / (song.bpm * speed), cur = Math.min(beat, song.endBeat);
      el("time").textContent = fmt(cur * spb) + " / " + fmt(song.endBeat * spb);
      if (!dragging && performance.now() - lastSeek > 150) {
        seek.value = Math.min(beat, song.endBeat);
      }
    }

    if (Tone.Transport.state === "started" && beat > song.endBeat) resetPlayback();
    requestAnimationFrame(frame);
  }

  loadMidi(0);
  requestAnimationFrame(frame);
});
</script>
