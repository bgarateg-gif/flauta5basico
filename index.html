<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>Flauta Dulce – Repertorio Estudiantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
<style>
  :root {
    --fg: #1E293B;
    --muted: #64748B;
    --bg: #F1F5F9;
    --card: #FFFFFF;
    --surface: #F8FAFC;
    --border: #E2E8F0;
    --primary: #4F46E5;
    --primary-hover: #4338CA;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: 10px 14px;
    gap: 10px;
    overflow: hidden;
  }

  /* Modo pantalla completa (nativo + modo estudio expandido para iPhone/iOS) */
  body.is-fullscreen {
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    height: 100dvh !important;
    z-index: 999999 !important;
    background: var(--bg) !important;
    padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)) !important;
    gap: 6px !important;
  }

  body.is-fullscreen .controls {
    padding: 5px 10px !important;
    gap: 6px 10px !important;
    border-radius: 12px !important;
  }

  body.is-fullscreen .song-group,
  body.is-fullscreen .speed-group,
  body.is-fullscreen .system-group,
  body.is-fullscreen #toggle-extra,
  body.is-fullscreen .score-header,
  body.is-fullscreen .lbl {
    display: none !important;
  }

  body.is-fullscreen .transport-group {
    flex: 0 0 auto !important;
  }

  body.is-fullscreen .seek-group {
    flex: 1 1 120px !important;
  }

  body.is-fullscreen #play,
  body.is-fullscreen #stop,
  body.is-fullscreen #fs {
    min-height: 32px !important;
    padding: 4px 12px !important;
    font-size: 13px !important;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
  }

  /* ============ Barra superior de controles ============ */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
    padding: 10px 16px;
    flex-shrink: 0;
  }

  .group {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .song-group {
    flex: 2 1 260px;
    min-width: 0;
  }

  .speed-group {
    flex: 1 1 190px;
    min-width: 0;
  }

  .system-group {
    flex: 0 0 auto;
  }

  .transport-group {
    flex: 0 0 auto;
  }

  .seek-group {
    flex: 1 1 280px;
    min-width: 0;
  }

  .actions-right {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-left: auto;
  }

  .lbl {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    white-space: nowrap;
  }

  select {
    flex: 1;
    width: 100%;
    min-height: 36px;
    padding: 4px 12px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    text-overflow: ellipsis;
    transition: border-color 0.15s ease;
  }

  select:hover {
    border-color: #CBD5E1;
  }

  select:focus-visible,
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }

  button {
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    min-height: 36px;
    padding: 5px 14px;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
  }

  button:active {
    transform: translateY(1px);
  }

  /* Botón principal Iniciar */
  #play {
    background: var(--primary);
    color: #FFFFFF;
    border: none;
    padding: 5px 18px;
    box-shadow: 0 2px 8px rgba(79, 70, 229, 0.28);
  }

  #play:hover {
    background: var(--primary-hover);
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
  }

  /* Botones secundarios */
  .btn-sec {
    background: var(--surface);
    color: var(--fg);
    border: 1px solid var(--border);
  }

  .btn-sec:hover {
    background: #F1F5F9;
    border-color: #CBD5E1;
  }

  #toggle-extra {
    display: none;
  }

  /* Selector agrupado tipo píldora (Digitación) */
  .pill-group {
    display: inline-flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }

  .pill-group button {
    min-height: 28px;
    padding: 3px 12px;
    font-size: 13px;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    box-shadow: none;
  }

  .pill-group button:hover {
    color: var(--fg);
  }

  .pill-group button.on {
    background: var(--card);
    color: var(--fg);
    box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
  }

  /* Controles deslizantes */
  input[type=range] {
    flex: 1;
    min-width: 60px;
    height: 24px;
    accent-color: #4F46E5;
    cursor: pointer;
    margin: 0;
  }

  #speedv {
    min-width: 4.2ch;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 13px;
    color: var(--fg);
  }

  #time {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    min-width: 8ch;
    font-weight: 700;
    color: var(--muted);
  }

  /* ============ Tarjeta principal de partitura ============ */
  .stage-card {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .score-header {
    padding: 8px 16px 6px;
    border-bottom: 1px solid #F1F5F9;
    text-align: center;
    flex-shrink: 0;
  }

  #status {
    margin: 0;
    font-size: 17px;
    font-weight: 800;
    color: var(--fg);
    letter-spacing: -0.01em;
    line-height: 1.2;
  }

  main {
    flex: 1;
    min-height: 0;
    position: relative;
    width: 100%;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: var(--card);
  }

  /* ============ Adaptación Móvil Vertical (Portrait) ============ */
  @media (max-width: 768px) {
    body {
      padding: 6px 8px;
      gap: 6px;
    }

    .controls {
      padding: 8px 10px;
      gap: 6px 8px;
      border-radius: 14px;
    }

    .song-group {
      flex: 1 1 100%;
    }

    .transport-group {
      flex: 1 1 auto;
    }

    .transport-group #play {
      flex: 1;
    }

    #toggle-extra {
      display: inline-flex;
      padding: 5px 10px;
      font-size: 13px;
    }

    .controls.compact-mobile .speed-group,
    .controls.compact-mobile .system-group {
      display: none;
    }

    .speed-group {
      flex: 1 1 48%;
    }

    .system-group {
      flex: 0 0 auto;
    }

    .system-group .lbl {
      display: none;
    }

    .seek-group {
      flex: 1 1 100%;
    }

    .actions-right {
      margin-left: 0;
    }

    .fs-label {
      display: none;
    }

    #fs {
      padding: 5px 10px;
    }

    .stage-card {
      border-radius: 14px;
    }

    .score-header {
      padding: 6px 12px 5px;
    }

    #status {
      font-size: 15px;
    }
  }

  /* ============ Adaptación Móvil Horizontal (Landscape) ============ */
  @media (max-height: 520px) and (orientation: landscape) {
    body {
      padding: 4px 6px;
      gap: 4px;
    }

    .controls {
      padding: 4px 8px;
      gap: 4px 8px;
      border-radius: 12px;
    }

    .controls.compact-mobile .speed-group,
    .controls.compact-mobile .system-group {
      display: flex;
    }

    #toggle-extra,
    .lbl {
      display: none;
    }

    select, button {
      min-height: 30px;
      font-size: 13px;
      padding: 2px 10px;
      border-radius: 8px;
    }

    .pill-group {
      padding: 2px;
    }

    .pill-group button {
      min-height: 24px;
      padding: 2px 9px;
      font-size: 12px;
    }

    .song-group {
      flex: 1 1 140px;
      max-width: 195px;
    }

    .transport-group {
      flex: 0 0 auto;
    }

    .speed-group {
      flex: 1 1 100px;
      max-width: 155px;
    }

    .system-group {
      flex: 0 0 auto;
    }

    .seek-group {
      flex: 1 1 130px;
    }

    #time {
      font-size: 12px
